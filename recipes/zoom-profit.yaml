# "Aaj ki kamaai kitni hui?" - the day's bills, then the camera pushes in on
# Net Profit so the figure is the last thing on screen.
video: zoom-profit

business:
  name: JHANVI MOMOS CORNER

invoice:
  number: 108

items:
  - { name: VEG MOMOS PLATE, rate: 60, qty: 2, gst: 5, unit: PLATE, purchase: 26 }

shots:
  - screen: sales-list
    duration: 3.4
    actions:
      - { at: 1.6, do: tap, target: change-range }

  # Dashboard -> Reports. Without this beat the video cut from the day's bills
  # straight into the Profit and Loss report with nothing explaining the jump.
  - screen: home
    duration: 2.2
    actions:
      - { at: 1.2, do: tap, target: reports }

  - screen: profit-loss
    duration: 5.4
    actions:
      - { at: 1.4, do: zoom, target: net-profit, to: 2.4 }
      - { at: 4.2, do: zoomOut }
