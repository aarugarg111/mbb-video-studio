# Fast Billing.
# Shop, item names and prices are taken from the live app recordings
# (reference/recording-findings.md). The narrative is invented - script #5's
# real text is not in the /form bank yet.
video: agarwal-fast-billing

# The invoice this video creates. Change both for a second video, or the
# screens show the default number.
invoice:
  number: 5945
  theme: none

business:
  name: SAGAR SUPERBAZAAR
  gstin: 09ABCDE1234F1Z5
  address: Main Market, Agra, Uttar Pradesh, 282001

party:
  name: ASHOK POLITHIN CENTER
  phone: 98765 43210
  address: Sadar Bazaar, Agra, Uttar Pradesh, 282003

# Prices are tax-inclusive, as the app treats them. gst is the slab percentage.
items:
  - { name: TATA SALT 1KG, rate: 30,  qty: 10, gst: 5, unit: PCS }
  - { name: SUGAR 5KG,     rate: 250, qty: 2,  gst: 5, unit: PCS }

shots:
  - screen: home
    duration: 2.0
    actions:
      - { at: 1.3, do: tap, target: create-invoice-cta }

  - screen: create-bill
    duration: 2.2
    actions:
      - { at: 0.4, do: tap, target: party-field }
      - { at: 1.1, do: selectParty }
      - { at: 1.8, do: tap, target: add-items }

  - screen: create-invoice
    duration: 4.4
    actions:
      - { at: 0.4, do: type, target: item-search, text: S, duration: 0.5 }
      - { at: 1.5, do: addItem, index: 0 }
      - { at: 2.4, do: addItem, index: 1 }
      - { at: 3.8, do: tap, target: generate-bill }

  - screen: invoice-created
    duration: 3.0
