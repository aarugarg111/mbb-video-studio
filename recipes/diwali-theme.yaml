# A Diwali script: the bill is made, the festive Theme Store opens, Diwali is
# picked and the bill closes themed. Shop and items follow the other demos.
video: diwali-theme

invoice:
  number: 5947
  date: "10/10/2026"
  theme: none

business:
  name: SAGAR SUPERBAZAAR
  gstin: 09ABCDE1234F1Z5
  address: Gupta Stationers, West Bengal, 741253

party:
  name: ARYAN ENTERPRISES
  phone: 98765 43210
  address: Delhi

items:
  - { name: ARHAR DAL GOLD 1KG, rate: 180,  qty: 1, gst: 5, unit: PCS }
  - { name: ANJEER PREMIUM 500GM, rate: 1200, qty: 1, gst: 5, unit: PCS }

shots:
  - screen: create-invoice
    duration: 3.6
    actions:
