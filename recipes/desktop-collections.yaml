# myCashFlo on a laptop, end to end. The same process the phone clip shows -
# what is stuck, who is worst, the automation set up, and the thing still
# running afterwards - in the interface a desk gives you.
#
# It used to be two shots of one screen: the book, and a follow-up sheet. That
# showed the app but not what it does, and stopped before anything had been
# set up. A collections clip has to end on the reminder that keeps going after
# the owner shuts the laptop.
#
# Every name and figure is invented.
video: desktop-collections

business:
  name: SHREE BALAJI BUILDING MATERIALS

party:
  name: AGRAWAL CONSTRUCTIONS
  balance: 1400000
  overdueDays: 68
  standby: 3

cashflo:
  parties:
    - { name: SHANTI INFRA PROJECTS, balance: 1150000, overdueDays: 94, standby: 3 }
    - { name: M R BUILDCON, balance: 900000, overdueDays: 41, standby: 2 }
    - { name: Deepak Hardware Stores, balance: 760000, overdueDays: 22, standby: 2 }
    - { name: NAVEEN CEMENT AGENCY, balance: 620000, overdueDays: 0, standby: 0 }
    - { name: Sunil Traders, balance: 370000, overdueDays: 9, standby: 1 }

shots:
  # What is stuck, and who needs what doing about them. The laptop opens on the
  # dashboard the way the phone does - this is the question the clip answers.
  - screen: mcf-desktop-dashboard
    duration: 4.0
    actions:
      - { at: 2.0, do: tap, target: setup-followups }

  # The whole book, worst first, with what is being done about each one.
  - screen: mcf-desktop
    duration: 3.6
    actions:
      - { at: 1.8, do: tap, target: setup-automation }

  # The follow-up being configured, then handed over.
  - screen: mcf-desktop
    duration: 3.4
    actions:
      - { at: 1.6, do: tap, target: continue }

  # And what is left running: the automations, with the parties each one is
  # chasing. This is the beat the clip never had.
  - screen: mcf-desktop-automations
    duration: 4.2
    actions:
      - { at: 1.6, do: tap, target: automation-0 }
      - { at: 3.0, do: tap, target: automation-2 }
