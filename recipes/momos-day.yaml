# "One Day as a Momos Seller" - scene 6, the reveal.
#
# Scenes 1 to 5 are the creator's own footage. The app moment is the last one:
# she opens myBillBook and the day adds up on camera.
#
# The item is what the stall sells; every sale, the total and the profit are
# arithmetic on it rather than figures written on the screen.
video: momos-day

business:
  name: JHANVI MOMOS CORNER

party:
  name: Cash Sale

invoice:
  number: 108
  date: "13/10/2026"
  theme: none

items:
  - { name: VEG MOMOS PLATE, rate: 60, qty: 2, gst: 5, unit: PLATE, purchase: 26 }

shots:
  # Every bill of the day, narrowed to today.
  - screen: sales-list
    duration: 3.6
    actions:
      - { at: 1.8, do: tap, target: change-range }

  # And what it actually earned - Net Profit is the figure the script asks for.
  - screen: profit-loss
    duration: 3.8
