# "One Day as a Momos Seller" - scene 6, the reveal.
#
# Scenes 1 to 5 are the creator's own footage. The app moment is the last one:
# she opens myBillBook and the day adds up on camera.
#
# The two figures the script settles - the day's takings and what was left of
# them - are stated, because the creator says them out loud at the end. They
# were arithmetic on the item before, so the reveal was 1,560 and 884 while
# the voiceover said 10,570 and 2,420.
#
# Everything else is still worked out: the script says "you can assume rest of
# the amount", and a day of 10,570 at 60 rupees a plate is 176 plates, which
# is what the report costs.
video: momos-day

business:
  name: JHANVI MOMOS CORNER

party:
  name: Cash Sale

invoice:
  number: 108
  theme: none

# Scene 6: "ye rahi aaj ki total kamaai".
sales:
  dayTotal: 10570
  netProfit: 2420

items:
  - { name: VEG MOMOS PLATE, rate: 60, qty: 2, gst: 5, unit: PLATE, purchase: 26 }

shots:
  # Scene 6, the reveal. Narrow the range to today, then scroll the day's
  # cash sales past the camera - sixty bills at a momos stall, six on screen
  # at a time, so the scroll is the only way to show that there were that
  # many.
  - screen: sales-list
    duration: 7.0
    actions:
      - { at: 1.2, do: tap, target: change-range }
      - { at: 2.8, do: scroll, distance: 300, duration: 1.6 }
      - { at: 4.8, do: scroll, distance: 300, duration: 1.6 }

  # The total. It is NOT on the list - the real screen has no total on it -
  # so it is read where the app actually shows it: the week's takings on the
  # home screen, which for a one-day recipe is the day's.
  - screen: home
    duration: 3.0
    actions:
      - { at: 1.6, do: tap, target: reports }

  # And what was left of it: Sale 10,570 less Purchase 8,150 is Net Profit
  # 2,420, which is the figure the script ends on.
  - screen: profit-loss
    duration: 4.0
