# "When I Will Get Rich, There Will Be Signs" - scene 4 only.
#
# Scenes 1 to 3 are the creator's own footage; the app moment is the kirana
# shopkeeper billing a bag of snacks and sending it to her number.
#
# Deliberately a LONG bill - a day's worth of snacks - because that is the
# joke, and because a bill this long is what would show any trouble with the
# item list. Every name is invented.
video: kirana-snacks

