<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage</title>
<link rel="stylesheet" href="../kit/tokens.css">
<link rel="stylesheet" href="../kit/kit.css">
<style>
  html, body {
    margin: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--mbb-brand-slate);
  }
  #frame {
    width: 1080px;
    height: 1920px;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  /* The space below the 150px logo band. The phone's layout box is 412x866;
   * scale() works about its centre, so centring the box centres the result:
   * 741.6 x 1558.8 inside 1080 x 1770. */
  #stage-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #phone {
    padding: 11px;
    background: var(--stage-phone-body);
    border-radius: 46px;
    transform: scale(1.8);
  }
  #viewport {
    position: relative;
    width: 390px;
    height: 844px;
    border-radius: 36px;
    overflow: hidden;
    background: var(--mbb-tint-100);
  }
  .layer { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div id="frame">
    <div class="logo-band"><img src="../kit/brand/mybillbook-logo-reverse.png" alt="myBillBook"></div>
    <div id="stage-area">
      <div id="phone">
        <div id="viewport"></div>
      </div>
    </div>
    <div id="endcard-root"></div>
  </div>
  <script type="module" src="./stage.js"></script>
</body>
</html>
