<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<link rel="stylesheet" href="../kit/tokens.css">
<link rel="stylesheet" href="../kit/kit.css">
<style>
  html, body {
    margin: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--mbb-ink);
  }
  #frame {
    width: 1080px;
    height: 1920px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #phone {
    padding: 11px;
    background: #15171c;
    border-radius: 46px;
    transform: scale(2);
  }
  #viewport {
    position: relative;
    width: 390px;
    height: 844px;
    border-radius: 36px;
    overflow: hidden;
    background: var(--mbb-tint-100);
  }
  .layer { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div id="frame">
    <div id="phone">
      <div id="viewport"></div>
    </div>
  </div>
  <script type="module" src="./stage.js"></script>
</body>
</html>
